[project]
name = "glyph"
version = "0.1.0"
description = "Marks that stay on the frame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "natsort>=8.4",
    "pillow>=11.0",
    "pyside6>=6.8",
]

[project.scripts]
glyph = "glyph.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph"]
sources = ["src"]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
